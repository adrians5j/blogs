title: Blog drafts
theme: jekyll-theme-primer

# Only the posts linked from index.md are published.
exclude:
  - voice/
  - what-i-use-ai-for.md
  - standalone-webiny-backend.md
  - v5-vs-v6.md
  - v5-vs-v6/
  - ai-in-2026.md
  - ai-in-2026/

# Neither post starts with a heading, so the page title comes from here.
defaults:
  - scope: { path: "webiny-6-5.md" }
    values: { title: "Webiny 6.5" }
  - scope: { path: "standalone-webiny.md" }
    values: { title: "Introducing standalone Webiny" }
